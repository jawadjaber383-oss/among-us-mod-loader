
workflows:
  among-us-mod-manager:
    name: Among Us Mod Manager APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract and build Android project
        script: |
          set -e
          mkdir -p unpacked
          unzip -o "AmongUsModManager-AndroidStudio-Project.zip" -d unpacked
          PROJECT_DIR="$(find "$CM_BUILD_DIR/unpacked" -name settings.gradle.kts -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - unpacked/**/app/build/outputs/apk/debug/*.apk
      
